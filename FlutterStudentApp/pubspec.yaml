name: mewtionary_student
description: Mewtionary offline-first English-Bangla learning app without Unity or a visual guide.
publish_to: "none"
version: 2.8.6+34

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_tts: ^4.2.0
  speech_to_text: ^7.0.0
  shared_preferences: ^2.3.3
  sqflite: ^2.4.1
  path: ^1.9.1
  file_selector: 1.1.0
  path_provider: 2.1.6
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/content/
    - assets/packs/
