name: Build Mewtionary Flutter-Only APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Show tool versions
        run: |
          flutter --version
          java -version
          sdkmanager --version

      - name: Validate curriculum and content packs
        run: python3 ../ContentTools/validate_content.py

      - name: Generate Android host project
        working-directory: FlutterStudentApp
        run: flutter create --platforms=android --project-name mewtionary_student .

      - name: Prepare Android project
        working-directory: FlutterStudentApp
        run: python3 tool/prepare_android.py

      - name: Resolve packages
        working-directory: FlutterStudentApp
        run: flutter pub get

      - name: Static analysis
        working-directory: FlutterStudentApp
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        working-directory: FlutterStudentApp
        run: flutter test

      - name: Build debug APK
        working-directory: FlutterStudentApp
        run: flutter build apk --debug

      - name: Verify APK
        run: |
          test -f FlutterStudentApp/build/app/outputs/flutter-apk/app-debug.apk
          ls -lh FlutterStudentApp/build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mewtionary-v2.8.5-Flutter-only-debug-apk
          path: FlutterStudentApp/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
